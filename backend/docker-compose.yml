services:
  verilens-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verilens_verification_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=VeriLens AI Backend
      - ENVIRONMENT=production
      - DEBUG=false
      - PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:////app/data/verilens.db
      - MAX_IMAGE_SIZE_MB=10
      - MAX_TEXT_LENGTH=10000
    volumes:
      - verilens_data:/app/data
      - verilens_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  verilens_data:
  verilens_logs:
